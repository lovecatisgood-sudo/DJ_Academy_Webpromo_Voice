<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowBot — Admin Dashboard (V1.1 Corrected Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122A2E; --ink-2:#1C3A40; --teal:#0E7C6B; --teal-dark:#0A5F52; --teal-soft:#E3F2EE;
  --surface:#F5F7F6; --card:#FFFFFF; --line:#E2E8E6; --muted:#5E7370; --faint:#94A6A3;
  --alert:#E5484D; --alert-soft:#FDECEC; --amber:#F0A63A; --amber-soft:#FCF0DC;
  --violet:#7C5CD6; --violet-soft:#EEE9FB; --green:#2E9E5B; --green-soft:#E4F4EA;
  --slate:#64748B; --slate-soft:#EDF1F5;
  --line-ch:#06C755; --wa-ch:#25D366; --ms-ch:#0084FF; --web-ch:#0E7C6B;
  --r:10px; --sh:0 1px 3px rgba(18,42,46,.08);
  --font:'IBM Plex Sans Thai',system-ui,sans-serif; --disp:'Space Grotesk',var(--font);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--surface);color:var(--ink);font-size:14px;line-height:1.5}
button{font-family:var(--font);cursor:pointer;border:none;background:none;font-size:13.5px;color:inherit}
input,select,textarea{font-family:var(--font);font-size:13.5px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
::placeholder{color:var(--faint)}
h1,h2,h3{font-weight:600}
.num{font-family:var(--disp)}
svg.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- buttons & chips ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px;border:1px solid transparent;transition:filter .12s}
.btn:hover{filter:brightness(.96)}
.btn-p{background:var(--teal);color:#fff}
.btn-o{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-danger{background:var(--alert);color:#fff}
.btn-ghost{color:var(--teal);font-weight:600}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;font-family:var(--disp)}
.pill-status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.st-new{background:var(--slate-soft);color:var(--slate)} .st-pending_follow_up{background:var(--amber-soft);color:#B27718}
.st-appointment_made{background:var(--teal-soft);color:var(--teal-dark)} .st-not_closed_follow{background:var(--violet-soft);color:var(--violet)}
.st-closed_deal{background:var(--green-soft);color:var(--green)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal-dark);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:500;font-family:ui-monospace,monospace}
.tag button{color:var(--teal-dark);font-size:13px;line-height:1}

/* ---------- login ---------- */
.login{display:flex;min-height:100vh}
.login-brand{flex:1;background:linear-gradient(160deg,var(--ink) 0%,#0D3B38 100%);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between}
.wordmark{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.wordmark .mark{width:34px;height:34px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center}
.login-brand h1{font-size:34px;line-height:1.25;font-weight:600;max-width:420px;margin-top:24px}
.login-brand h1 em{font-style:normal;color:#7BD9C6}
.ticks{display:flex;flex-direction:column;gap:14px;margin-top:36px;color:#B9CFC9;font-size:14.5px}
.ticks div{display:flex;gap:10px;align-items:center}
.ticks .dot{background:#7BD9C6}
.login-form{width:460px;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:100%;max-width:330px}
.login-card h2{font-size:21px;margin-bottom:4px}
.login-card p.sub{color:var(--muted);margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.demo-note{margin-top:18px;background:var(--amber-soft);border:1px solid #F3DCB4;color:#8A5E14;border-radius:8px;padding:9px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:218px 1fr;height:100vh;overflow:hidden}
.side{background:var(--ink);color:#C4D6D1;display:flex;flex-direction:column;padding:18px 12px}
.side .wordmark{color:#fff;font-size:17px;padding:4px 8px 20px}
.side .wordmark .mark{width:28px;height:28px;border-radius:8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#C4D6D1;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--teal);color:#fff}
.nav .badge{margin-left:auto}
.tenant{margin-top:auto;background:rgba(255,255,255,.05);border-radius:10px;padding:12px}
.tenant b{color:#fff;font-size:13px;display:block}
.tenant span{font-size:11.5px;color:#8FA8A2}
.tenant button{margin-top:9px;color:#7BD9C6;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex:none}
.topbar h2{font-size:16.5px;margin-right:auto}
.topbar .crumb{color:var(--faint);font-weight:400}
.gsearch{position:relative;width:250px}
.gsearch svg{position:absolute;left:9px;top:9px;color:var(--faint)}
.gsearch input{padding-left:32px;background:var(--surface);border-radius:999px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface)}
.iconbtn .badge{position:absolute;top:1px;right:0;height:16px;min-width:16px;font-size:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--disp)}
.healthpill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;background:var(--green-soft);color:var(--green);font-size:11.5px;font-weight:700;white-space:nowrap}
.canvas{flex:1;overflow:auto;padding:22px}

/* ---------- overview ---------- */
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.attn{display:flex;gap:12px;align-items:center;cursor:pointer}
.attn .n{font-family:var(--disp);font-size:26px;font-weight:700}
.attn.red{border-left:4px solid var(--alert)} .attn.amber{border-left:4px solid var(--amber)}
.attn p{color:var(--muted);font-size:13px}
.stat h4{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .n{font-size:27px;font-weight:700;margin-top:2px}
.stat .d{font-size:12px;margin-top:2px}
.up{color:var(--green)} .down{color:var(--alert)}
.card h3{font-size:14px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:7px;height:130px}
.bars .b{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:4px;position:relative}
.bars .b:hover{background:var(--teal-dark)}
.bars-x{display:flex;gap:7px;margin-top:6px}
.bars-x span{flex:1;text-align:center;font-size:10.5px;color:var(--faint)}
.funnel .fr{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.funnel .fl{width:170px;font-size:12.5px;color:var(--muted)}
.funnel .fb{height:22px;border-radius:5px;background:var(--teal)}
.funnel .fn{font-family:var(--disp);font-weight:600;font-size:13px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.rowlink:hover td{background:var(--surface);cursor:pointer}

/* ---------- chat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;max-width:1100px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile .ch-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile h4{font-size:15px}
.tile .sub{font-size:12.5px;color:var(--muted)}
.tile .prev{font-size:12.5px;color:var(--faint);font-style:italic;border-top:1px dashed var(--line);padding-top:9px}
.tile .badge{position:absolute;top:14px;right:14px}
.tile.locked{cursor:pointer;background:repeating-linear-gradient(45deg,#fff,#fff 12px,#FAFBFB 12px,#FAFBFB 24px)}
.tile.locked .ch-ic{background:var(--slate-soft)!important;color:var(--faint)}
.tile.locked h4{color:var(--muted)}
.lock-tag{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;color:var(--faint);background:var(--slate-soft);border-radius:999px;padding:3px 10px;width:fit-content}
.sect-label{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin:6px 0 10px}

/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:290px 1fr 300px;height:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.ib-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ib-tools{padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.convs{overflow:auto;flex:1}
.conv{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.conv:hover{background:var(--surface)}
.conv.on{background:var(--teal-soft)}
.conv .av{width:38px;height:38px;border-radius:50%;background:var(--slate-soft);color:var(--slate);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--disp);flex:none}
.conv .cb{min-width:0;flex:1}
.conv .r1{display:flex;align-items:center;gap:6px}
.conv .r1 b{font-size:13.5px}
.conv .t{margin-left:auto;font-size:11px;color:var(--faint);flex:none}
.conv .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv .r3{display:flex;align-items:center;gap:6px;margin-top:5px}
.star{color:#D6DEDC} .star.on{color:var(--amber)}
.ib-thread{display:flex;flex-direction:column;min-width:0;min-height:0;background:#F2F5F4}
.th-head{background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.brow{display:flex;flex-direction:column;max-width:76%}
.brow.left{align-self:flex-start;align-items:flex-start}
.brow.right{align-self:flex-end;align-items:flex-end}
.bub{padding:9px 13px;border-radius:14px;font-size:13.5px;box-shadow:var(--sh)}
.left .bub{background:#fff;border-bottom-left-radius:4px}
.right .bub{background:var(--teal-soft);border-bottom-right-radius:4px}
.right.admin .bub{background:var(--teal);color:#fff}
.who{font-size:10.5px;color:var(--faint);margin-top:3px;display:flex;gap:5px;align-items:center}
.optchips{display:flex;flex-wrap:wrap;gap:6px;max-width:76%;align-self:flex-end;justify-content:flex-end}
.optchips span{border:1.5px solid var(--teal);color:var(--teal-dark);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;background:#fff}
.optchips span.picked{background:var(--teal);color:#fff}
.sysnote{align-self:center;font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:8px;margin:4px 0}
.sysnote:before,.sysnote:after{content:"";width:46px;height:1px;background:var(--line)}
.ctacard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:10px 13px;font-size:12.5px;box-shadow:var(--sh)}
.ctacard b{display:flex;gap:7px;align-items:center;font-size:12.5px;margin-bottom:4px}
.ctacard .kv{color:var(--muted)}
.state-bar{padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;border-top:1px solid var(--line)}
.state-bar.bot{background:var(--teal-soft);color:var(--teal-dark)}
.state-bar.await{background:var(--alert-soft);color:var(--alert)}
.state-bar.admin{background:var(--amber-soft);color:#8A5E14}
.state-bar .btn{margin-left:auto}
.composer{background:#fff;padding:10px 14px;display:flex;gap:9px;border-top:1px solid var(--line)}
.composer input{border-radius:999px;background:var(--surface)}
.sendbtn{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ib-side{border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#FBFCFC}
.panel h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h5 .btn-ghost{margin-left:auto;font-size:12px}
.pfield{margin-bottom:9px}
.pfield label{font-size:11px;font-weight:600;color:var(--faint);display:flex;gap:5px;align-items:center;margin-bottom:3px}
.pfield input,.pfield textarea{padding:7px 9px;font-size:13px}
.rowact{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--amber-soft);border-radius:8px;padding:8px 11px;font-size:12.5px;margin-bottom:7px}
.note i{display:block;font-style:normal;color:#8A5E14;font-size:10.5px;margin-top:3px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:5px}

/* ---------- settings ---------- */
.settings{display:grid;grid-template-columns:190px 1fr;gap:16px;height:100%;min-height:0}
.subnav{display:flex;flex-direction:column;gap:2px}
.subnav button{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.subnav button.on{background:var(--teal-soft);color:var(--teal-dark);font-weight:600}
.subnav button:hover{background:var(--surface)}
.set-body{min-width:0;overflow:auto}
.fb-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.fb-head .spacer{flex:1}
.vchip{font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px}
.vchip.draft{background:var(--amber-soft);color:#8A5E14}
.vchip.live{background:var(--green-soft);color:var(--green)}
.builder{display:grid;grid-template-columns:minmax(330px,42%) 1fr;gap:14px;align-items:start}
.tree{padding:8px}
.tnode{border-radius:8px;margin:1px 0}
.trow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}
.trow:hover{background:var(--surface)}
.trow.on{background:var(--teal-soft)}
.trow .twist{width:16px;color:var(--faint);flex:none;font-size:10px}
.tico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.tico svg{width:13px;height:13px}
.t-options{background:var(--teal)} .t-message{background:var(--slate)} .t-cta{background:var(--violet)}
.trow .warn{margin-left:auto;color:var(--amber)}
.tkids{margin-left:24px;border-left:1px dashed var(--line);padding-left:6px}
.linkback{color:var(--faint);font-style:italic;font-size:12px}
.editor .ecard{border-top:3px solid var(--teal)}
.langtabs{display:flex;gap:4px;background:var(--surface);border-radius:8px;padding:3px;width:fit-content;margin-bottom:9px}
.langtabs button{padding:4px 14px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--muted)}
.langtabs button.on{background:#fff;box-shadow:var(--sh);color:var(--ink)}
.optrow{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.optrow .drag{color:var(--faint);cursor:grab}
.optrow input{flex:1}
.optrow select{width:150px;flex:none}
.kwrap{display:flex;gap:6px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.kwrap input{border:none;width:130px;padding:3px}
.mindmap{position:sticky;top:0}
.mindmap svg{width:100%;height:auto;background:#FBFCFC;border-radius:8px;border:1px solid var(--line)}
.mm-node{cursor:pointer}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
/* simulator */
.sim-wrap{position:fixed;inset:0;background:rgba(18,42,46,.45);display:flex;justify-content:flex-end;z-index:60}
.sim{width:390px;background:var(--surface);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.sim-head{background:var(--ink);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px}
.sim-head .btn-sm{margin-left:auto;background:rgba(255,255,255,.14);color:#fff}
.sim .msgs{background:#EAF0EE}
.simopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;align-self:stretch;padding:0 4px}
.simopts button{border:1.5px solid var(--teal);color:var(--teal-dark);background:#fff;border-radius:999px;padding:7px 6px;font-size:12px;font-weight:600;line-height:1.3}
.simopts button:hover{background:var(--teal-soft)}
.contactchips{display:flex;gap:7px;flex-wrap:wrap}
.contactchips span{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
/* widget preview */
.wprev{background:linear-gradient(150deg,#DCE7E3,#EFF3F1);border-radius:12px;border:1px solid var(--line);min-height:430px;position:relative;overflow:hidden}
.wprev .fake{position:absolute;inset:18px 18px auto;color:#B7C6C1;font-size:12px}
.wbubble{position:absolute;bottom:18px;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.wpanel{position:absolute;bottom:84px;width:280px;background:#fff;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.18);overflow:hidden}
.wpanel .wh{color:#fff;padding:12px 14px;font-weight:600;display:flex;gap:8px;align-items:center;font-size:13.5px}
.wpanel .wb{padding:12px;font-size:12.5px}
.wgreet{background:var(--surface);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.wopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:5px}
.wopts span{border:1.2px solid currentColor;border-radius:999px;text-align:center;padding:4px 2px;font-size:10.5px;font-weight:600}
/* channels list */
.chanrow{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.chanrow:last-child{border-bottom:none}
.chanrow .ch-ic{width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center}
.chanrow b{font-size:13.5px;display:block}
.chanrow span{font-size:12px;color:var(--muted)}
.chanrow .rowact{margin-left:auto}
/* drawer, modal, toast, dropdown */
.overlay{position:fixed;inset:0;background:rgba(18,42,46,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:420px;background:#fff;height:100%;overflow:auto;padding:20px;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.modal-w{position:fixed;inset:0;background:rgba(18,42,46,.45);z-index:70;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:22px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin-bottom:8px}
.modal p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.modal .rowact{justify-content:flex-end}
#toast{position:fixed;left:22px;bottom:22px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toastmsg{background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;display:flex;gap:9px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .18s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.dd{position:absolute;top:50px;right:0;width:330px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(18,42,46,.16);z-index:40;overflow:hidden}
.dd h6{padding:11px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
.dd .ndd{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;align-items:flex-start}
.dd .ndd:hover{background:var(--surface)}
.dd .ndd small{color:var(--faint);display:block;font-size:11.5px}
.timeline .tlrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.timeline .tlrow:last-child{border-bottom:none}
@media(max-width:1150px){.inbox{grid-template-columns:260px 1fr}.ib-side{display:none}.builder{grid-template-columns:1fr}.mindmap{position:static}}
@media(max-width:767px){.shell{grid-template-columns:1fr}.side{display:none}.topbar{padding:0 12px}.topbar>.gsearch{display:none}.canvas{padding:12px}.login-brand{display:none}.login-form{width:100%;min-height:100vh}.sim{width:100%}.drawer{width:100%}.healthpill{max-width:150px;overflow:hidden;text-overflow:ellipsis}.inbox{grid-template-columns:1fr;min-width:720px}.canvas{overflow:auto}}
@media(max-width:420px){.simopts,.wopts{grid-template-columns:1fr}.topbar h2{font-size:14px}.healthpill{font-size:10.5px;padding:4px 7px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Flow builder ---- */
function kids(id){const n=FLOW[id];let out=[];
 if(n.type==='options')out=n.opts.map(o=>({id:o.t,link:!!o.link,label:o.en}));
 else if(n.next)out=[{id:n.next,link:n.next==='root'||countParents(n.next)>1,label:''}];
 return out;}
function countParents(id){let c=0;for(const k in FLOW){const n=FLOW[k];if(n.opts&&n.opts.some(o=>o.t===id))c++;if(n.next===id)c++;}return c;}
function typeCls(t){return t==='options'?'t-options':t==='message'?'t-message':'t-cta';}
function typeIcon(t){return t==='options'?'grid':t==='message'?'msg':t==='cta-form'?'form':t==='cta-link'?'link':t==='cta-contact'?'pin':'users';}
function typeName(t){return {options:'Options node',message:'Message node','cta-form':'CTA · Lead form','cta-link':'CTA · External link','cta-contact':'CTA · Contact card','cta-live':'CTA · Live chat'}[t];}

function treeHTML(id,seen){
 seen=seen||new Set(); const n=FLOW[id];
 const ks=kids(id).filter(k=>!k.link&&FLOW[k.id]&&!seen.has(k.id));
 seen.add(id);
 const collapsed=S.collapsed[id];
 const warn = n.type==='message' && !n.next;
 return `<div class="tnode">
  <div class="trow ${S.selNode===id?'on':''}" onclick="S.selNode='${id}';render()">
   <span class="twist" onclick="event.stopPropagation();S.collapsed['${id}']=!S.collapsed['${id}'];render()">${ks.length?(collapsed?'▶':'▼'):''}</span>
   <span class="tico ${typeCls(n.type)}">${ic(typeIcon(n.type))}</span>
   <span style="flex:1;min-width:0"><b>${esc(n.title)}</b>
    ${n.opts?`<span style="color:var(--faint);font-size:11.5px"> · ${n.opts.length}/6 options</span>`:''}</span>
   ${warn?`<span class="warn" title="Leaf without CTA">${ic('warn',14)}</span>`:''}
  </div>
  ${!collapsed&&ks.length?`<div class="tkids">${ks.map(k=>treeHTML(k.id,seen)).join('')}
   ${kids(id).filter(k=>k.link).map(k=>`<div class="trow"><span class="twist"></span><span class="linkback">↩ links to “${esc(FLOW[k.id]?.title||k.id)}”</span></div>`).join('')}</div>`
  :!collapsed?kids(id).filter(k=>k.link).map(k=>`<div class="tkids"><div class="trow"><span class="twist"></span><span class="linkback">↩ links to “${esc(FLOW[k.id]?.title||k.id)}”</span></div></div>`).join(''):''}
 </div>`;
}

function mindmapSVG(){
 const pos={},edges=[];let row=0;
 (function walk(id,depth,seen){
  seen.add(id); pos[id]={x:depth,y:row};
  const ks=kids(id); let first=true;
  ks.forEach(k=>{ edges.push([id,k.id,k.link||seen.has(k.id)]);
   if(!k.link&&FLOW[k.id]&&!seen.has(k.id)){ if(!first)row++; walk(k.id,depth+1,seen); first=false; } });
  if(!ks.filter(k=>!k.link&&FLOW[k.id]).length&&id!=='root')return;
 })('root',0,new Set());
 const CW=176,RH=52,NW=150,NH=34;
 const W=(Math.max(...Object.values(pos).map(p=>p.x))+1)*CW+20, H=(row+1)*RH+24;
 const P=id=>({x:pos[id].x*CW+12,y:pos[id].y*RH+12});
 const col=t=>t==='options'?'var(--teal)':t==='message'?'var(--slate)':'var(--violet)';
 return `<svg viewBox="0 0 ${W} ${H}">
  ${edges.filter(e=>pos[e[1]]).map(([a,b,link])=>{const p1=P(a),p2=P(b);
    return `<path d="M${p1.x+NW} ${p1.y+NH/2} C ${p1.x+NW+30} ${p1.y+NH/2}, ${p2.x-30} ${p2.y+NH/2}, ${p2.x} ${p2.y+NH/2}" fill="none" stroke="${link?'#C6D2CF':'#9DB5B0'}" stroke-width="1.6" ${link?'stroke-dasharray="4 4"':''}/>`;}).join('')}
  ${Object.keys(pos).map(id=>{const n=FLOW[id],p=P(id),sel=S.selNode===id;
    return `<g class="mm-node" onclick="S.selNode='${id}';render()">
     <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="9" fill="${sel?col(n.type):'#fff'}" stroke="${col(n.type)}" stroke-width="${sel?2:1.4}"/>
     <circle cx="${p.x+15}" cy="${p.y+NH/2}" r="4.5" fill="${sel?'#fff':col(n.type)}"/>
     <text x="${p.x+27}" y="${p.y+NH/2+4}" font-size="11" font-weight="600" font-family="IBM Plex Sans Thai" fill="${sel?'#fff':'#122A2E'}">${esc(n.title).slice(0,20)}</text></g>`;}).join('')}
 </svg>`;
}

/* ---- Simulator (runs the real tree) ---- */
function startSim(){S.sim={msgs:[],cur:null,await:false};simGoto('root');}
function simPush(m){S.sim.msgs.push(m);}
function simGoto(id){
 let n=FLOW[id];
 while(n){
  simPush({f:'bot',t:n[S.simLang||'en']||n.en});
  if(n.type==='options'){S.sim.cur=id;break;}
  if(n.type==='cta-link'){simPush({f:'cta',t:'🔗 '+n.url});}
  if(n.type==='cta-form'){simPush({f:'cta',t:'📋 Lead form: '+n.fields.join(' · ')});}
  if(n.type==='cta-contact'||n.type==='cta-live'){simPush({f:'contacts'});if(n.type==='cta-live')S.sim.await=true;}
  if(n.next){id=n.next;n=FLOW[id];} else {S.sim.cur=null;break;}
 }
 render();
}
function simTap(i){const n=FLOW[S.sim.cur];const o=n.opts[i];simPush({f:'v',t:o.en});simGoto(o.t);}
function simType(){
 const inp=el('simin');const q=(inp.value||'').trim();if(!q)return;inp.value='';
 simPush({f:'v',t:q});
 if(S.sim.await){simPush({f:'sys',t:'Bot paused — waiting for admin'});render();return;}
 const ql=q.toLowerCase();let hit=null;
 for(const id in FLOW){const n=FLOW[id];
  if((n.kw||[]).some(k=>ql.includes(k.toLowerCase())||k.toLowerCase().includes(ql))){hit=id;break;}}
 if(hit){simPush({f:'sys',t:`Keyword match → “${FLOW[hit].title}”`});simGoto(hit);}
 else{simPush({f:'sys',t:'No keyword match → fallback'});
  simPush({f:'bot',t:'ขออภัยค่ะ แอดมินจะรีบมาตอบโดยเร็วที่สุด 🙏 Sorry! An admin will reply shortly — or reach us instantly:'});
  simPush({f:'contacts'});S.sim.await=true;render();}
}
function simView(){

 return `<div class="sim-wrap" onclick="S.sim=null;render()"><div class="sim" onclick="event.stopPropagation()">

   <button class="btn btn-sm" onclick="startSim()">Restart</button>
   <button class="iconbtn" style="color:#fff" onclick="S.sim=null;render()">${ic('x')}</button></div>
  <div class="msgs" id="simscroll">
   ${S.sim.msgs.map(m=>{
    if(m.f==='sys')return `<div class="sysnote">${esc(m.t)}</div>`;
    if(m.f==='cta')return `<div class="brow left"><div class="ctacard">${esc(m.t)}</div></div>`;
    if(m.f==='contacts')return `<div class="contactchips">${CONTACTS.map(c=>`<span>${ic(c.type==='mail'?'mail':c.type==='phone'?'phone':'chat',13)} ${esc(c.label)} ${esc(c.value)}</span>`).join('')}</div>`;
    return m.f==='v'?`<div class="brow right"><div class="bub" style="background:var(--teal);color:#fff">${esc(m.t)}</div></div>`
     :`<div class="brow left"><div class="bub">${esc(m.t)}</div><div class="who">${ic('bot',11)} bot</div></div>`;}).join('')}
   ${cur?`<div class="simopts">${cur.opts.map((o,i)=>`<button onclick="simTap(${i})">${esc(o.en)}</button>`).join('')}</div>`:''}
  </div>
  <div class="composer"><input id="simin" placeholder="Type like a visitor… try “ราคา” or “parking”" onkeydown="if(event.key==='Enter')simType()">
   <button class="sendbtn" onclick="simType()">${ic('send',16)}</button></div>
 </div></div>`;
}

name: DJAY SaaS Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      apply:
        description: Apply the reviewed plan. False is a plan-only run.
        type: boolean
        default: false
        required: true
      bootstrap_platform:
        description: First platform run only; creates data infrastructure without Cloud Run services.
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: djay-saas-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  GCP_REGION: asia-southeast3
  TF_ROOT: DJAY_Bot_SaaS_Platform/infra/terraform/gcp-platform

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: DJAY_Bot_SaaS_Platform/infra/terraform/gcp-platform
    steps:
      - uses: actions/checkout@v6
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Guard the selected project
        env:
          EXPECTED_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          test -n "$EXPECTED_PROJECT_ID"
          test "$(gcloud config get-value project)" = "$EXPECTED_PROJECT_ID"
          gcloud projects describe "$EXPECTED_PROJECT_ID" --format='value(projectId)'
      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ secrets.GCP_TERRAFORM_STATE_BUCKET }}"
          -backend-config="prefix=djay/${{ inputs.environment }}/platform"
      - name: Materialize environment configuration
        env:
          TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
        run: |
          test -n "$TFVARS_JSON"
          printf '%s' "$TFVARS_JSON" > deployment.auto.tfvars.json
      - run: terraform validate
      - name: Plan exact release
        env:
          BOOTSTRAP_PLATFORM: ${{ inputs.bootstrap_platform }}
        run: |
          deploy_services=true
          if [ "$BOOTSTRAP_PLATFORM" = "true" ]; then deploy_services=false; fi
          terraform plan -input=false -out=deployment.tfplan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="release_version=${{ github.sha }}" \
            -var="deploy_services=$deploy_services" \
            -var="deploy_migration_job=$deploy_services"
      - name: Apply data foundation
        if: ${{ inputs.apply && inputs.bootstrap_platform }}
        run: terraform apply -input=false -auto-approve deployment.tfplan

  images:
    if: ${{ inputs.apply && !inputs.bootstrap_platform }}
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: public-site, dockerfile: deploy/docker/Dockerfile.next }
          - { app: tenant-web, dockerfile: deploy/docker/Dockerfile.next }
          - { app: platform-master, dockerfile: deploy/docker/Dockerfile.next }
          - { app: api, dockerfile: deploy/docker/Dockerfile.next }
          - { app: ai-gateway, dockerfile: deploy/docker/Dockerfile.bundle }
          - { app: voice-gateway, dockerfile: deploy/docker/Dockerfile.bundle }
          - { app: widget-cdn, dockerfile: deploy/docker/Dockerfile.bundle }
          - { app: workers, dockerfile: deploy/docker/Dockerfile.bundle }
    steps:
      - uses: actions/checkout@v6
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: DJAY_Bot_SaaS_Platform
          file: DJAY_Bot_SaaS_Platform/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: APP=${{ matrix.app }}
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/djay/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    if: ${{ inputs.apply && !inputs.bootstrap_platform }}
    needs: images
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: DJAY_Bot_SaaS_Platform/infra/terraform/gcp-platform
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - uses: google-github-actions/setup-gcloud@v3
      - run: >-
          terraform init -input=false
          -backend-config="bucket=${{ secrets.GCP_TERRAFORM_STATE_BUCKET }}"
          -backend-config="prefix=djay/${{ inputs.environment }}/platform"
      - name: Materialize environment configuration
        env:
          TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
        run: |
          test -n "$TFVARS_JSON"
          printf '%s' "$TFVARS_JSON" > deployment.auto.tfvars.json
      - name: Update the one-shot migration job
        run: >-
          terraform apply -input=false -auto-approve
          -target=google_cloud_run_v2_job.database_migration
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}"
          -var="release_version=${{ github.sha }}"
          -var="deploy_services=true"
          -var="deploy_migration_job=true"
      - name: Apply database migrations before runtime rollout
        run: >-
          gcloud run jobs execute
          "djay-${{ inputs.environment }}-database-migration"
          --region="${{ env.GCP_REGION }}" --wait
      - name: Deploy runtime services after schema admission
        run: >-
          terraform apply -input=false -auto-approve
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}"
          -var="release_version=${{ github.sha }}"
          -var="deploy_services=true"
          -var="deploy_migration_job=true"

  widget-cache:
    if: ${{ inputs.apply && !inputs.bootstrap_platform }}
    needs: deploy
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: DJAY_Bot_SaaS_Platform
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Invalidate widget CDN
        run: >-
          gcloud compute url-maps invalidate-cdn-cache
          "djay-${{ inputs.environment }}-https" --path="/*" --global --quiet
